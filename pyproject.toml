[project]
name = "arabic-normalization-retrieval"
version = "1.0.0"
description = "Controlled Arabic normalization experiments for BM25 and dense retrieval on MIRACL"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Ahmad Awad" }]
dependencies = []

[project.optional-dependencies]
dense = ["sentence-transformers>=6.1,<7"]
dev = ["numpy>=2.5,<3", "pytest>=8.3,<9", "ruff>=0.8"]

[project.scripts]
arabic-retrieval = "arabic_normalization_retrieval.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arabic_normalization_retrieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
